name: Blog Manager
slug: blog-manager
type: plugin
version: 2.0.1
description: Simplify blog post management in Grav admin
icon: book
author:
  name: Dr Droid
  email: gravdev@drdroid.fr
  url: https://github.com/DrDroid-FR
homepage: https://github.com/DrDroid-FR/grav-plugin-blog-manager-2
keywords: blog, manager, admin, posts, markdown
bugs: https://github.com/DrDroid-FR/grav-plugin-blog-manager-2/issues
docs: https://github.com/DrDroid-FR/grav-plugin-blog-manager-2/blob/main/README.md
license: MIT
compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: api, version: '>=1.0.0' }
  - { name: admin2, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_BLOG_MANAGER.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    blog_path:
      type: blog-path
      label: PLUGIN_BLOG_MANAGER.BLOG_PATH
      size: large
      help: PLUGIN_BLOG_MANAGER.BLOG_PATH_HELP
      placeholder: '/blog'
